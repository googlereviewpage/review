<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapMax Değerlendirme Sistemi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #ffffff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 360px; width: 90%; border: 1px solid #e1e4e8; }
        h2 { color: #1a73e8; font-size: 24px; font-weight: 600; margin-bottom: 8px; margin-top: 0; }
        p { color: #5f6368; font-size: 14px; line-height: 1.5; margin-bottom: 30px; }
        .yildizlar { display: flex; justify-content: space-between; flex-direction: row-reverse; max-width: 280px; margin: 0 auto; }
        .yildiz { font-size: 48px; color: #e8eaed; cursor: pointer; transition: transform 0.1s, color 0.2s; }
        .yildiz:hover { transform: scale(1.1); }
        .yildiz:hover, .yildiz:hover ~ .yildiz { color: #fbbc05; }
        
        /* Kurumsal Başarı Grafiği */
        .success-checkmark { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 50%; background: #e6f4ea; display: flex; align-items: center; justify-content: center; }
        .success-checkmark svg { width: 40px; height: 40px; color: #137333; }
    </style>
</head>
<body>
    <div class="container" id="main-box">
        <h2>Müşteri Memnuniyet Anketi</h2>
        <p>Hizmet kalitemizi artırmak adına deneyiminizi bizimle paylaşır mısınız?</p>
        <div class="yildizlar">
            <span class="yildiz" onclick="oyVer(5)">★</span>
            <span class="yildiz" onclick="oyVer(4)">★</span>
            <span class="yildiz" onclick="oyVer(3)">★</span>
            <span class="yildiz" onclick="oyVer(2)">★</span>
            <span class="yildiz" onclick="oyVer(1)">★</span>
        </div>
    </div>

    <script>
        // Yeni Güncel Caddebostan Burger King Google Haritalar Yorum Bağlantısı
        const googleYorumLinki = "https://search.google.com/local/writereview?placeid=ChIJM6oyyXPHyhQRT7biqh70YaU";

        function oyVer(yildizSayisi) {
            const kutu = document.getElementById('main-box');
            if (yildizSayisi >= 4) {
                // 4 veya 5 Yıldız: Doğrudan yeni Google Haritalar linkine ışınlar
                window.location.href = googleYorumLinki;
            } else {
                // 1, 2 veya 3 Yıldız: Emojisiz, kurumsal başarı ekranını gösterir
                kutu.innerHTML = `
                    <div class="success-checkmark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <h2 style="color: #137333; font-size: 22px;">Geri Bildiriminiz Alındı</h2>
                    <p>Değerlendirmeniz için teşekkür ederiz. Görüşleriniz hizmet standartlarımızı geliştirmek üzere ilgili birimlerimize iletilmiştir.</p>
                `;
            }
        }
    </script>
</body>
</html>
